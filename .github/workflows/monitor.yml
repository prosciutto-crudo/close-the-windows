name: Temperature monitor

on:
  schedule:
    # Every 5 minutes, ~07:00–23:00 Europe/Madrid (05:00–21:00 UTC).
    # Re-armed each morning by rearm.yml; disables itself once it has alerted.
    - cron: "*/5 5-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: temperature-monitor
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check temperature and notify on crossing
        id: check
        env:
          WU_STATION_ID: ${{ secrets.WU_STATION_ID }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          THRESHOLD_C: "24"
        run: python3 monitor.py

      - name: Commit state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "State unchanged — nothing to commit."
          else
            git commit -m "Update threshold state"
            git push
          fi

      - name: Pause until tomorrow morning (re-armed by rearm.yml)
        if: steps.check.outputs.notified == 'true'
        run: |
          echo "Alert sent — disabling scheduled runs until rearm.yml re-enables them."
          gh workflow disable monitor.yml
