name: Window monitor

on:
  schedule:
    # Every 5 minutes, 24/7. The repo is public, so Actions minutes are free.
    # This native schedule is only a backup — GitHub's `schedule` is best-effort
    # and drops many */5 runs under load. Reliable cadence comes from the Val Town
    # cron pinger firing workflow_dispatch; the concurrency group dedupes overlaps.
    # Pushes are still gated to 06:00–22:00 Madrid in-script (QUIET_HOURS) —
    # overnight runs log data silently.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: window-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll, notify on flip, log data point
        env:
          WU_STATION_ID: ${{ secrets.WU_STATION_ID }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          SHELLY_SERVER: ${{ secrets.SHELLY_SERVER }}
          SHELLY_DEVICE_ID: ${{ secrets.SHELLY_DEVICE_ID }}
          SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          MARGIN_C: "0.5"
          # Keep 4 days in data.json so the dashboard can overlay each past 24h
          # window on one time-of-day axis (today bold, older days faded).
          # history.csv stays the indefinite archive regardless of this window.
          WINDOW_HOURS: "96"
          # Temporary while testing: pushes can arrive any hour. Flip QUIET_HOURS
          # back to "on" once you're done watching pings land.
          QUIET_HOURS: "off"
          NOTIFY_ON_INIT: "on"
        run: python3 monitor.py

      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.csv
          if git diff --staged --quiet; then
            echo "Data unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Log reading"

          # The native schedule and the Val Town pinger can fire within the same
          # second; the concurrency group doesn't serialise reliably at that
          # granularity, so both runs poll, both commit, and the slower one's
          # push is rejected as non-fast-forward. Rebasing it on is pointless —
          # the two readings are seconds apart (duplicates), and they'd conflict
          # anyway (data.json is rewritten wholesale, history.csv appends at EOF).
          # So: retry to ride out transient failures, and if the remote has
          # genuinely moved on, drop our duplicate and finish green. Any other
          # push failure still fails the job loudly.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git fetch origin main
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "Remote already contains this commit — nothing to do."
              exit 0
            fi
            if [ "$(git rev-parse HEAD~1)" != "$(git rev-parse origin/main)" ]; then
              echo "A sibling run logged the same moment — dropping this duplicate reading."
              git reset --hard origin/main
              exit 0
            fi
            echo "Push failed but remote is unchanged — retrying (attempt $attempt)."
            sleep 5
          done
          echo "::error::Could not push data after 3 attempts."
          exit 1
