name: Window monitor

on:
  schedule:
    # Every 20 min over the Madrid daytime window. UTC 04:00–20:59 covers
    # 06:00–22:00 Europe/Madrid across DST; monitor.py applies the precise
    # quiet-hours guard (22:00–06:00 Madrid) in-script. ~48 runs/day.
    - cron: "*/20 4-20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: window-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare indoor vs outdoor and notify on flip
        env:
          WU_STATION_ID: ${{ secrets.WU_STATION_ID }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          SHELLY_SERVER: ${{ secrets.SHELLY_SERVER }}
          SHELLY_DEVICE_ID: ${{ secrets.SHELLY_DEVICE_ID }}
          SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          MARGIN_C: "1.0"
          # Temporary while testing: notifications can arrive any hour, and the
          # first run pushes the current recommendation instead of init'ing quietly.
          QUIET_HOURS: "off"
          NOTIFY_ON_INIT: "on"
        run: python3 monitor.py

      - name: Commit state if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "State unchanged — nothing to commit."
          else
            git commit -m "Update window state"
            git push
          fi
